name: Deploy demo to GitHub Pages

# Publishes the compiled, self-contained demo workspace in www/ to GitHub Pages.
# The dashboards auto-enter demo mode (baked-in mock data) when served from *.github.io,
# so dashboard.html runs standalone with no Home Assistant or credentials.
# Demo: https://jaketherabbit.github.io/HA-Irrigation-Strategy/dashboard.html?demo=1

on:
  push:
    branches: [main]
    paths:
      - 'www/**'
      - 'frontend/**'
      - 'scripts/build_course.py'
      - 'scripts/install_course_media.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Build current workspace
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend
      - name: Build and verify academy catalogue
        run: |
          python scripts/build_course.py
          node --test tests/academy.test.mjs
      - name: Install pinned academy narration and video
        run: |
          python scripts/install_course_media.py
          python scripts/build_course.py --verify-media
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: www
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
