name: Deploy demo to GitHub Pages

# Publishes the compiled, self-contained demo workspace in www/ to GitHub Pages.
# The dashboards auto-enter demo mode (baked-in mock data) when served from *.github.io,
# so dashboard.html runs standalone with no Home Assistant or credentials.
# Demo: https://jaketherabbit.github.io/HA-Irrigation-Strategy/dashboard.html?demo=1

on:
  push:
    branches: [main]
    paths:
      - 'www/**'
      - 'frontend/**'
      - 'scripts/build_course.py'
      - 'scripts/install_course_media.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Build current workspace
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend
      - name: Build and verify academy catalogue
        run: |
          python scripts/build_course.py
          node --test tests/academy.test.mjs
      - name: Install pinned academy narration and video
        run: |
          python scripts/install_course_media.py
          python scripts/build_course.py --verify-media
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: www
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
