name: Release packaging

on:
  release:
    types: [created]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')
    name: Build release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up frontend build runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Build the bundled operator dashboard
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend

      - name: Create archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          # Custom Component package (HACS)
          zip -r dist/custom_components_crop_steering.zip custom_components/crop_steering \
            -x "**/__pycache__/**" "**/*.pyc" "**/.mypy_cache/**" "**/.pytest_cache/**" "**/.DS_Store" "**/.git/**"
          # Source-only MCP package; never includes local credentials or node_modules.
          git archive --format=zip --output=dist/crop_steering_mcp_source.zip HEAD mcp-server docs/MCP.md LICENSE

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-artifacts
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Attach assets to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/custom_components_crop_steering.zip
            dist/crop_steering_mcp_source.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
