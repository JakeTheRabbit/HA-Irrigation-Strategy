name: Release packaging

on:
  release:
    types: [created]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')
    name: Build release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1

      - name: Set up frontend build runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Build the bundled operator dashboard
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend

      - name: Create archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          # Custom Component package (HACS)
          zip -r dist/custom_components_crop_steering.zip custom_components/crop_steering \
            -x "**/__pycache__/**" "**/*.pyc" "**/.mypy_cache/**" "**/.pytest_cache/**" "**/.DS_Store" "**/.git/**"
          # Source-only MCP package; never includes local credentials or node_modules.
          git archive --format=zip --output=dist/crop_steering_mcp_source.zip HEAD mcp-server docs/MCP.md LICENSE

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-artifacts
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Attach assets to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            dist/custom_components_crop_steering.zip
            dist/crop_steering_mcp_source.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
