name: Promote

on:
  workflow_dispatch:
    inputs:
      candidate_tag:
        description: Exact integration candidate tag (vX.Y.Z)
        required: true
        type: string
      dry_run:
        description: Check every gate without moving main or publishing the release
        default: true
        required: true
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: production-promotion
  cancel-in-progress: false

jobs:
  preflight:
    name: Read-only candidate checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      digest: ${{ steps.check.outputs.digest }}
    steps:
      - name: Require dispatch from main
        env:
          DISPATCH_REF: ${{ github.ref }}
        run: test "$DISPATCH_REF" = refs/heads/main
      - name: Checkout trusted main workflow code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check exact candidate, CI and approved evidence
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
        run: python3 .github/scripts/promotion.py --tag "$CANDIDATE_TAG"

  promote:
    name: Fast-forward production then publish the matching release
    needs: preflight
    if: ${{ !inputs.dry_run && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      # Only to start the Pages demo deploy and the container image re-tag below.
      actions: write
    steps:
      - name: Checkout the same trusted main workflow code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Recheck the plan before the first write
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
          PROMOTION_DIGEST: ${{ needs.preflight.outputs.digest }}
        run: python3 .github/scripts/promotion.py --tag "$CANDIDATE_TAG" --apply
      - name: Publish the promoted dashboard demo
        # main was just moved with this workflow's token, and a push made with it starts no other
        # workflow, so pages.yml never saw it and the demo kept the previous release. A dispatch
        # is the one event the token may start.
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
      - name: Re-tag the promoted controller image as stable
        # The same token limit: container.yml re-tags :latest and :<major.minor> to the digest
        # the candidate already published. Nothing is rebuilt.
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
        run: gh workflow run container.yml --repo "$GITHUB_REPOSITORY" --ref main -f tag="$CANDIDATE_TAG" -f channel=stable
