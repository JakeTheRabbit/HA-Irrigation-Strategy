# Every action in .github/workflows is pinned to a commit SHA (tests/test_workflow_pins.py).
# Dependabot opens a pull request when a newer release exists and updates the SHA and the
# release named in its trailing comment.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
