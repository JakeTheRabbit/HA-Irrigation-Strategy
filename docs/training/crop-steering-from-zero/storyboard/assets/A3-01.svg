="#998270" stroke="#6d6056" stroke-width="2"/><text x="700" y="330" font-size="53" fill="#25363a" font-weight="600" text-anchor="start">“Full” ≠ 100% VWC</text><text x="700" y="430" font-size="33" fill="#25363a" font-weight="400" text-anchor="start">The total volume still includes solids.</text><text x="700" y="485" font-size="33" fill="#25363a" font-weight="400" text-anchor="start">Ask which drained condition</text><text x="700" y="540" font-size="33" fill="#25363a" font-weight="400" text-anchor="start">the operating reference represents.</text><text x="120" y="740" font-size="28" fill="#647171" font-weight="400" text-anchor="start">No universal percentage is prescribed in this lesson.</text><text x="80" y="889" font-size="19" fill="#647171" font-weight="400" text-anchor="start">Teaching illustration • example values only • not a product screenshot</text></g></svg>