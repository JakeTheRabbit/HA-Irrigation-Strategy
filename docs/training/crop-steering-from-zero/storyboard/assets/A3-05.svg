<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">An example is not your target</title><desc id="desc">Conceptual educational storyboard frame for A3-05. Numbers are teaching examples, not crop targets.</desc><rect width="1600" height="900" fill="#faf7f1"/><g font-family="Arial, Helvetica, sans-serif"><text x="80" y="57" font-size="22" fill="#647171" font-weight="400" text-anchor="start">A3-05 / CROP STEERING FROM ZERO</text><text x="80" y="115" font-size="42" fill="#25363a" font-weight="600" text-anchor="start">An example is not your target</text><rect x="110" y="220" width="650" height="310" rx="20" fill="white" stroke="#dadbd5" stroke-width="2"/><rect x="110" y="220" width="7" height="310" rx="0" fill="#008cbb" stroke="#008cbb" stroke-width="2"/><text x="140" y="277" font-size="31" fill="#25363a" font-weight="600" text-anchor="start">Teaching example: 60%</text><text x="140" y="332" font-size="25" fill="#25363a" font-weight="400" text-anchor="start">A hypothetical reference.</text><text x="140" y="369" font-size="25" fill="#25363a" font-weight="400" text-anchor="start">Not a target to copy.</text><rect x="830" y="220" width="650" height="310" rx="20" fill="white" stroke="#dadbd5" stroke-width="2"/><rect x="830" y="220" width="7" height="310" rx="0" fill="#b83d82" stroke="#b83d82" stroke-width="2"/><text x="860" y="277" font-size="31" fill="#25363a" font-weight="600" text-anchor="start">Your container</text><text x="860" y="332" font-size="25" fill="#25363a" font-weight="400" text-anchor="start">Medium + dimensions</text><text x="860" y="369" font-size="25" fill="#25363a" font-weight="400" text-anchor="start">Drainage protocol + sensor</text><text x="860" y="406" font-size="25" fill="#25363a" font-weight="400" text-anchor="start">Repeat and verify</text><text x="110" y="610" font-size="32" fill="#25363a" font-weight="600" text-anchor="start">A peak reading alone is not a calibration procedure.</text><rect x="110" y="680" width="430" height="110" rx="20" fill="white" stroke="#dadbd5" stroke-width="2"/><text x="140" y="745" font-size="29" fill="#25363a" font-weight="600" text-anchor="start">Saturation</text><rect x="580" y="680" width="430" height="110" rx="20" fill="white" stroke="#dadbd5" stroke-width="2"/><text x="610" y="745" font-size="29" fill="#25363a" font-weight="600" text-anchor="start">Drained capacity</text><rect x="1050" y="680" width="430" height="110" rx="20" fill="white" stroke="#dadbd5" stroke-width="2"/><text x="1080" y="745" font-size="29" fill="#25363a" font-weight="600" text-anchor="start">Configured reference</text><text x="80" y="889" font-size="19" fill="#647171" font-weight="400" text-anchor="start">Teaching illustration • example values only • not a product screenshot</text></g></svg>