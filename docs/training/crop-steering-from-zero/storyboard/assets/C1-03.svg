<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Draw the actual water path</title><desc id="desc">Conceptual educational storyboard frame for C1-03. Numbers are teaching examples, not crop targets.</desc><rect width="1600" height="900" fill="#faf7f1"/><g font-family="Arial, Helvetica, sans-serif"><text x="80" y="57" font-size="22" fill="#647171" font-weight="400" text-anchor="start">C1-03 / CROP STEERING FROM ZERO</text><text x="80" y="115" font-size="42" fill="#25363a" font-weight="600" text-anchor="start">Draw the actual water path</text><text x="85" y="225" font-size="34" fill="#25363a" font-weight="600" text-anchor="start">A — suitable pressurised supply</text><rect x="85" y="275" width="250" height="125" rx="20" fill="white" stroke="#dadbd5" stroke-width="2"/><text x="210" y="348" font-size="28" fill="#25363a" font-weight="600" text-anchor="middle">Supply</text><text x="347" y="352" font-size="31" fill="#25363a" font-weight="400" text-anchor="start">→</text><rect x="375" y="275" width="250" height="125" rx="20" fill="white" stroke="#dadbd5" stroke-width="2"/><text x="500" y="348" font-size="28" fill="#25363a" font-weight="600" text-anchor="middle">Protection*</text><text x="637" y="352" font-size="31" fill="#25363a" font-weight="400" text-anchor="start">→</text><rect x="665" y="275" width="250" height="125" rx="20" fill="white" stroke="#dadbd5" stroke-width="2"/><text x="790" y="348" font-size="28" fill="#25363a" font-weight="600" text-anchor="middle">Zone valve</text><text x="927" y="352" font-size="31" fill="#25363a" font-weight="400" text-anchor="start">→</text><rect x="955" y="275" width="250" height="125" rx="20" fill="white" stroke="#dadbd5" stroke-width="2"/><text x="1080" y="348" font-size="28" fill="#25363a" font-weight="600" text-anchor="middle">Emitters</text><text x="1217" y="352" font-size="31" fill="#25363a" font-weight="400" text-anchor="start">→</text><rect x="1245" y="275" width="250" height="125" rx="20" fill="white" stroke="#dadbd5" stroke-width="2"/><text x="1370" y="348" font-size="28" fill="#25363a" font-weight="600" text-anchor="middle">Pots / drain</text><text x="85" y="500" font-size="34" fill="#25363a" font-weight="600" text-anchor="start">B — reservoir route, when a pump is needed</text><rect x="85" y="550" width="250" height="125" rx="20" fill="white" stroke="#dadbd5" stroke-width="2"/><text x="210" y="623" font-size="28" fill="#25363a" font-weight="600" text-anchor="middle">Reservoir</text><text x="347" y="627" font-size="31" fill="#25363a" font-weight="400" text-anchor="start">→</text><rect x="375" y="550" width="250" height="125" rx="20" fill="white" stroke="#dadbd5" stroke-width="2"/><text x="500" y="623" font-size="28" fill="#25363a" font-weight="600" text-anchor="middle">Pump*</text><text x="637" y="627" font-size="31" fill="#25363a" font-weight="400" text-anchor="start">→</text><rect x="665" y="550" width="250" height="125" rx="20" fill="white" stroke="#dadbd5" stroke-width="2"/><text x="790" y="623" font-size="28" fill="#25363a" font-weight="600" text-anchor="middle">Protection*</text><text x="927" y="627" font-size="31" fill="#25363a" font-weight="400" text-anchor="start">→</text><rect x="955" y="550" width="250" height="125" rx="20" fill="white" stroke="#dadbd5" stroke-width="2"/><text x="1080" y="623" font-size="28" fill="#25363a" font-weight="600" text-anchor="middle">Zone valve</text><text x="1217" y="627" font-size="31" fill="#25363a" font-weight="400" text-anchor="start">→</text><rect x="1245" y="550" width="250" height="125" rx="20" fill="white" stroke="#dadbd5" stroke-width="2"/><text x="1370" y="623" font-size="28" fill="#25363a" font-weight="600" text-anchor="middle">Emitters / pots</text><text x="85" y="765" font-size="25" fill="#647171" font-weight="400" text-anchor="start">* Match actual equipment, order and protections to the installed design.</text><text x="85" y="805" font-size="25" fill="#647171" font-weight="400" text-anchor="start">Functional diagrams only — not plumbing or electrical construction drawings.</text><text x="80" y="889" font-size="19" fill="#647171" font-weight="400" text-anchor="start">Teaching illustration • example values only • not a product screenshot</text></g></svg>