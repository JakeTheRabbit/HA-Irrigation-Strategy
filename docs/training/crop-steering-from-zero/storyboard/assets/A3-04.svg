<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Physical state or entered setting?</title><desc id="desc">Conceptual educational storyboard frame for A3-04. Numbers are teaching examples, not crop targets.</desc><rect width="1600" height="900" fill="#faf7f1"/><g font-family="Arial, Helvetica, sans-serif"><text x="80" y="57" font-size="22" fill="#647171" font-weight="400" text-anchor="start">A3-04 / CROP STEERING FROM ZERO</text><text x="80" y="115" font-size="42" fill="#25363a" font-weight="600" text-anchor="start">Physical state or entered setting?</text><rect x="100" y="250" width="430" height="350" rx="20" fill="white" stroke="#dadbd5" stroke-width="2"/><rect x="100" y="250" width="7" height="350" rx="0" fill="#008cbb" stroke="#008cbb" stroke-width="2"/><text x="130" y="307" font-size="31" fill="#25363a" font-weight="600" text-anchor="start">Saturation</text><text x="130" y="362" font-size="25" fill="#25363a" font-weight="400" text-anchor="start">Physical condition</text><text x="130" y="399" font-size="25" fill="#25363a" font-weight="400" text-anchor="start">Pores filled with water</text><rect x="585" y="250" width="430" height="350" rx="20" fill="white" stroke="#dadbd5" stroke-width="2"/><rect x="585" y="250" width="7" height="350" rx="0" fill="#008cbb" stroke="#008cbb" stroke-width="2"/><text x="615" y="307" font-size="31" fill="#25363a" font-weight="600" text-anchor="start">Drained capacity</text><text x="615" y="362" font-size="25" fill="#25363a" font-weight="400" text-anchor="start">Physical condition</text><text x="615" y="399" font-size="25" fill="#25363a" font-weight="400" text-anchor="start">Defined drainage method</text><rect x="1070" y="250" width="430" height="350" rx="20" fill="white" stroke="#dadbd5" stroke-width="2"/><rect x="1070" y="250" width="7" height="350" rx="0" fill="#b83d82" stroke="#b83d82" stroke-width="2"/><text x="1100" y="307" font-size="31" fill="#25363a" font-weight="600" text-anchor="start">App reference</text><text x="1100" y="362" font-size="25" fill="#25363a" font-weight="400" text-anchor="start">Configured setting</text><text x="1100" y="399" font-size="25" fill="#25363a" font-weight="400" text-anchor="start">Needs measured evidence</text><text x="100" y="720" font-size="35" fill="#25363a" font-weight="600" text-anchor="start">The setting does not prove the physical condition.</text><text x="80" y="889" font-size="19" fill="#647171" font-weight="400" text-anchor="start">Teaching illustration • example values only • not a product screenshot</text></g></svg>