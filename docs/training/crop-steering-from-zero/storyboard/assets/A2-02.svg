<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Six out of ten</title><desc id="desc">Conceptual educational storyboard frame for A2-02. Numbers are teaching examples, not crop targets.</desc><rect width="1600" height="900" fill="#faf7f1"/><g font-family="Arial, Helvetica, sans-serif"><text x="80" y="57" font-size="22" fill="#647171" font-weight="400" text-anchor="start">A2-02 / CROP STEERING FROM ZERO</text><text x="80" y="115" font-size="42" fill="#25363a" font-weight="600" text-anchor="start">Six out of ten</text><text x="100" y="250" font-size="40" fill="#25363a" font-weight="600" text-anchor="start">Six of ten equal volumes are water.</text><rect x="100" y="330" width="120" height="190" rx="8" fill="#9bd4e7" stroke="#25363a" stroke-width="2"/><rect x="240" y="330" width="120" height="190" rx="8" fill="#9bd4e7" stroke="#25363a" stroke-width="2"/><rect x="380" y="330" width="120" height="190" rx="8" fill="#9bd4e7" stroke="#25363a" stroke-width="2"/><rect x="520" y="330" width="120" height="190" rx="8" fill="#9bd4e7" stroke="#25363a" stroke-width="2"/><rect x="660" y="330" width="120" height="190" rx="8" fill="#9bd4e7" stroke="#25363a" stroke-width="2"/><rect x="800" y="330" width="120" height="190" rx="8" fill="#9bd4e7" stroke="#25363a" stroke-width="2"/><rect x="940" y="330" width="120" height="190" rx="8" fill="#e8e1d6" stroke="#25363a" stroke-width="2"/><rect x="1080" y="330" width="120" height="190" rx="8" fill="#e8e1d6" stroke="#25363a" stroke-width="2"/><rect x="1220" y="330" width="120" height="190" rx="8" fill="#e8e1d6" stroke="#25363a" stroke-width="2"/><rect x="1360" y="330" width="120" height="190" rx="8" fill="#e8e1d6" stroke="#25363a" stroke-width="2"/><text x="100" y="590" font-size="52" fill="#008cbb" font-weight="600" text-anchor="start">6 ÷ 10 × 100 = 60% VWC</text><text x="100" y="675" font-size="28" fill="#647171" font-weight="400" text-anchor="start">The rest includes solids AND air.</text><text x="100" y="715" font-size="28" fill="#647171" font-weight="400" text-anchor="start">These blocks explain a fraction, not the physical arrangement of water.</text><text x="80" y="889" font-size="19" fill="#647171" font-weight="400" text-anchor="start">Teaching illustration • example values only • not a product screenshot</text></g></svg>