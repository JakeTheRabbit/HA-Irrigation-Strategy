<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Essentials, conditional, later</title><desc id="desc">Conceptual educational storyboard frame for C1-05. Numbers are teaching examples, not crop targets.</desc><rect width="1600" height="900" fill="#faf7f1"/><g font-family="Arial, Helvetica, sans-serif"><text x="80" y="57" font-size="22" fill="#647171" font-weight="400" text-anchor="start">C1-05 / CROP STEERING FROM ZERO</text><text x="80" y="115" font-size="42" fill="#25363a" font-weight="600" text-anchor="start">Essentials, conditional, later</text><rect x="85" y="230" width="440" height="440" rx="20" fill="white" stroke="#dadbd5" stroke-width="2"/><rect x="85" y="230" width="7" height="440" rx="0" fill="#008cbb" stroke="#008cbb" stroke-width="2"/><text x="115" y="287" font-size="31" fill="#25363a" font-weight="600" text-anchor="start">Start here</text><text x="115" y="342" font-size="25" fill="#25363a" font-weight="400" text-anchor="start">Supported host + network</text><text x="115" y="379" font-size="25" fill="#25363a" font-weight="400" text-anchor="start">Compatible VWC reading</text><text x="115" y="416" font-size="25" fill="#25363a" font-weight="400" text-anchor="start">Safe controllable water path</text><text x="115" y="453" font-size="25" fill="#25363a" font-weight="400" text-anchor="start">Known emitters + sizing</text><text x="115" y="490" font-size="25" fill="#25363a" font-weight="400" text-anchor="start">Isolation + independent protection</text><rect x="580" y="230" width="440" height="440" rx="20" fill="white" stroke="#dadbd5" stroke-width="2"/><rect x="580" y="230" width="7" height="440" rx="0" fill="#008cbb" stroke="#008cbb" stroke-width="2"/><text x="610" y="287" font-size="31" fill="#25363a" font-weight="600" text-anchor="start">Depends on the system</text><text x="610" y="342" font-size="25" fill="#25363a" font-weight="400" text-anchor="start">Pump: only if needed</text><text x="610" y="379" font-size="25" fill="#25363a" font-weight="400" text-anchor="start">Bridge: if probe needs it</text><text x="610" y="416" font-size="25" fill="#25363a" font-weight="400" text-anchor="start">Identified EC: for EC lessons</text><text x="610" y="453" font-size="25" fill="#25363a" font-weight="400" text-anchor="start">Useful climate/feed readings</text><rect x="1075" y="230" width="440" height="440" rx="20" fill="white" stroke="#dadbd5" stroke-width="2"/><rect x="1075" y="230" width="7" height="440" rx="0" fill="#b83d82" stroke="#b83d82" stroke-width="2"/><text x="1105" y="287" font-size="31" fill="#25363a" font-weight="600" text-anchor="start">Add later</text><text x="1105" y="342" font-size="25" fill="#25363a" font-weight="400" text-anchor="start">Extra representative probes</text><text x="1105" y="379" font-size="25" fill="#25363a" font-weight="400" text-anchor="start">Verified flow measurement</text><text x="1105" y="416" font-size="25" fill="#25363a" font-weight="400" text-anchor="start">UPS / expanded monitoring</text><text x="1105" y="453" font-size="25" fill="#25363a" font-weight="400" text-anchor="start">Advanced dosing or AI</text><text x="85" y="765" font-size="32" fill="#25363a" font-weight="600" text-anchor="start">Buy verified functions, not every dashboard accessory.</text><text x="80" y="889" font-size="19" fill="#647171" font-weight="400" text-anchor="start">Teaching illustration • example values only • not a product screenshot</text></g></svg>