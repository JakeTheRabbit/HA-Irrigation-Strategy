<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Put litres beside the fraction</title><desc id="desc">Conceptual educational storyboard frame for A2-03. Numbers are teaching examples, not crop targets.</desc><rect width="1600" height="900" fill="#faf7f1"/><g font-family="Arial, Helvetica, sans-serif"><text x="80" y="57" font-size="22" fill="#647171" font-weight="400" text-anchor="start">A2-03 / CROP STEERING FROM ZERO</text><text x="80" y="115" font-size="42" fill="#25363a" font-weight="600" text-anchor="start">Put litres beside the fraction</text><text x="110" y="250" font-size="40" fill="#25363a" font-weight="600" text-anchor="start">A hypothetical uniform 5 L sample</text><rect x="110" y="320" width="240" height="190" rx="12" fill="#9bd4e7" stroke="#25363a" stroke-width="2"/><rect x="380" y="320" width="240" height="190" rx="12" fill="#9bd4e7" stroke="#25363a" stroke-width="2"/><rect x="650" y="320" width="240" height="190" rx="12" fill="#9bd4e7" stroke="#25363a" stroke-width="2"/><rect x="920" y="320" width="240" height="190" rx="12" fill="#e8e1d6" stroke="#25363a" stroke-width="2"/><rect x="1190" y="320" width="240" height="190" rx="12" fill="#e8e1d6" stroke="#25363a" stroke-width="2"/><text x="110" y="585" font-size="46" fill="#008cbb" font-weight="600" text-anchor="start">3 L water ÷ 5 L total × 100 = 60%</text><text x="110" y="675" font-size="28" fill="#647171" font-weight="400" text-anchor="start">A volume explanation, not an instruction to add 3 L.</text><text x="110" y="715" font-size="28" fill="#647171" font-weight="400" text-anchor="start">A local probe does not establish the average of an entire pot.</text><text x="80" y="889" font-size="19" fill="#647171" font-weight="400" text-anchor="start">Teaching illustration • example values only • not a product screenshot</text></g></svg>