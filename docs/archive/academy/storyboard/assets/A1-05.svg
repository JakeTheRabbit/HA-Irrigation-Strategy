<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">What steering and sensing can do</title><desc id="desc">Conceptual educational storyboard frame for A1-05. Numbers are teaching examples, not crop targets.</desc><rect width="1600" height="900" fill="#faf7f1"/><g font-family="Arial, Helvetica, sans-serif"><text x="80" y="57" font-size="22" fill="#647171" font-weight="400" text-anchor="start">A1-05 / CROP STEERING FROM ZERO</text><text x="80" y="115" font-size="42" fill="#25363a" font-weight="600" text-anchor="start">What steering and sensing can do</text><rect x="100" y="220" width="410" height="250" rx="20" fill="white" stroke="#dadbd5" stroke-width="2"/><rect x="100" y="220" width="7" height="250" rx="0" fill="#008cbb" stroke="#008cbb" stroke-width="2"/><text x="130" y="277" font-size="31" fill="#25363a" font-weight="600" text-anchor="start">Local measurement</text><text x="130" y="332" font-size="25" fill="#25363a" font-weight="400" text-anchor="start">One probe</text><text x="130" y="369" font-size="25" fill="#25363a" font-weight="400" text-anchor="start">One sensing region</text><text x="130" y="406" font-size="25" fill="#25363a" font-weight="400" text-anchor="start">Not every pot</text><text x="545" y="365" font-size="60" fill="#25363a" font-weight="400" text-anchor="start">→</text><rect x="630" y="220" width="410" height="250" rx="20" fill="white" stroke="#dadbd5" stroke-width="2"/><rect x="630" y="220" width="7" height="250" rx="0" fill="#008cbb" stroke="#008cbb" stroke-width="2"/><text x="660" y="277" font-size="31" fill="#25363a" font-weight="600" text-anchor="start">A trend</text><text x="660" y="332" font-size="25" fill="#25363a" font-weight="400" text-anchor="start">Changes over time</text><text x="660" y="369" font-size="25" fill="#25363a" font-weight="400" text-anchor="start">Freshness matters</text><text x="660" y="406" font-size="25" fill="#25363a" font-weight="400" text-anchor="start">Not a diagnosis</text><text x="1070" y="365" font-size="60" fill="#25363a" font-weight="400" text-anchor="start">→</text><rect x="1150" y="220" width="350" height="250" rx="20" fill="white" stroke="#dadbd5" stroke-width="2"/><rect x="1150" y="220" width="7" height="250" rx="0" fill="#008cbb" stroke="#008cbb" stroke-width="2"/><text x="1180" y="277" font-size="31" fill="#25363a" font-weight="600" text-anchor="start">Check</text><text x="1180" y="332" font-size="25" fill="#25363a" font-weight="400" text-anchor="start">Equipment</text><text x="1180" y="369" font-size="25" fill="#25363a" font-weight="400" text-anchor="start">Other readings</text><text x="1180" y="406" font-size="25" fill="#25363a" font-weight="400" text-anchor="start">Observation</text><text x="100" y="550" font-size="34" fill="#25363a" font-weight="600" text-anchor="start">A smooth line does not prove uniform delivery.</text><g transform="translate(100 610) scale(0.65)"><rect x="0" y="0" width="430" height="300" rx="10" fill="#f0ebe1" stroke="#25363a" stroke-width="2"/><ellipse cx="40.0" cy="40.0" rx="25" ry="20" fill="#998270" stroke="#6d6056" stroke-width="2"/><ellipse cx="62.0" cy="68.0" rx="22" ry="10" fill="#9bd4e7"/><ellipse cx="110.0" cy="40.0" rx="25" ry="20" fill="#998270" stroke="#6d6056" stroke-width="2"/><ellipse cx="132.0" cy="68.0" rx="22" ry="10" fill="#9bd4e7"/><ellipse cx="180.0" cy="40.0" rx="25" ry="20" fill="#998270" stroke="#6d6056" stroke-width="2"/><ellipse cx="202.0" cy="68.0" rx="22" ry="10" fill="#9bd4e7"/><ellipse cx="250.0" cy="40.0" rx="25" ry="20" fill="#998270" stroke="#6d6056" stroke-width="2"/><ellipse cx="272.0" cy="68.0" rx="22" ry="10" fill="#9bd4e7"/><ellipse cx="320.0" cy="40.0" rx="25" ry="20" fill="#998270" stroke="#6d6056" stroke-width="2"/><ellipse cx="390.0" cy="40.0" rx="25" ry="20" fill="#998270" stroke="#6d6056" stroke-width="2"/><ellipse cx="50.0" cy="113.33333333333333" rx="25" ry="20" fill="#998270" stroke="#6d6056" stroke-width="2"/><ellipse cx="7