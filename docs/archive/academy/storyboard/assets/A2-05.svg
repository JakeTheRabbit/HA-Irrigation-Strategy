<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Teach it back</title><desc id="desc">Conceptual educational storyboard frame for A2-05. Numbers are teaching examples, not crop targets.</desc><rect width="1600" height="900" fill="#faf7f1"/><g font-family="Arial, Helvetica, sans-serif"><text x="80" y="57" font-size="22" fill="#647171" font-weight="400" text-anchor="start">A2-05 / CROP STEERING FROM ZERO</text><text x="80" y="115" font-size="42" fill="#25363a" font-weight="600" text-anchor="start">Teach it back</text><rect x="100" y="240" width="660" height="340" rx="20" fill="white" stroke="#dadbd5" stroke-width="2"/><rect x="100" y="240" width="7" height="340" rx="0" fill="#008cbb" stroke="#008cbb" stroke-width="2"/><text x="130" y="297" font-size="31" fill="#25363a" font-weight="600" text-anchor="start">Is the rest all air?</text><text x="130" y="352" font-size="25" fill="#25363a" font-weight="400" text-anchor="start">No. The remaining volume</text><text x="130" y="389" font-size="25" fill="#25363a" font-weight="400" text-anchor="start">includes solids and air.</text><rect x="820" y="240" width="660" height="340" rx="20" fill="white" stroke="#dadbd5" stroke-width="2"/><rect x="820" y="240" width="7" height="340" rx="0" fill="#b83d82" stroke="#b83d82" stroke-width="2"/><text x="850" y="297" font-size="31" fill="#25363a" font-weight="600" text-anchor="start">Is this usable water left?</text><text x="850" y="352" font-size="25" fill="#25363a" font-weight="400" text-anchor="start">No. VWC is a volume fraction,</text><text x="850" y="389" font-size="25" fill="#25363a" font-weight="400" text-anchor="start">not a plant-available fuel gauge.</text><text x="100" y="700" font-size="32" fill="#25363a" font-weight="400" text-anchor="start">Teach back: “60% of the sample volume is water.”</text><text x="100" y="740" font-size="32" fill="#25363a" font-weight="400" text-anchor="start">Then name one limitation of the reading.</text><text x="80" y="889" font-size="19" fill="#647171" font-weight="400" text-anchor="start">Teaching illustration • example values only • not a product screenshot</text></g></svg>