name: Crop Steering Controller
version: "3.14.0"
slug: f2_control
description: >-
  The controller of Crop Steering for Home Assistant. For each zone, it runs the
  four phases of the grow-day (P0, P1, P2 and P3) from the VWC and EC readings that
  the Crop Steering integration publishes. It operates the pump and the valves and
  reads back each valve after it closes. When the kill switch is off, the controller
  gives no shots. Configure the room in the Crop Steering dashboard, which opens in
  the Home Assistant sidebar.
url: https://github.com/JakeTheRabbit/HA-Irrigation-Strategy
arch:
  - amd64
  - aarch64
  - armv7
init: false
boot: auto
startup: application
# Seconds the Supervisor waits after SIGTERM before it kills the app (10 by default): the shot in
# flight is closed first, then dosing switches off what it has running (docs/DOSING.md).
timeout: 30
# The oldest Home Assistant the integration and this app support: the same number as hacs.json.
homeassistant: "2024.10.0"
homeassistant_api: true
hassio_api: false
host_network: false
ingress: true
ingress_port: 8420
panel_icon: mdi:sprout
panel_title: Crop Steering
# Set by the Supervisor on every start: this process runs as the Home Assistant app. A standalone
# container sets F2_RUNTIME=container instead. The controller (runtime_env) and run.sh read it.
environment:
  F2_RUNTIME: addon
options:
  num_zones: 3
  lights_on_hour: 10
  lights_off_hour: 22
  enable_flag: input_boolean.f2_control_enabled
  notify_service: ""
  notify_min: 30
  instance_name: Crop Steering
  feed_ec_sensor: ""
  feed_ph_sensor: ""
  sump_power_sensor: ""
  sump_silent_hours: 3
  pump_power_sensor: ""
  hold_entities: []
  substrate_l: 5
  flow_lps: 0.02
  loop_seconds: 60
  rediscover_seconds: 300
  brain_provider: auto
  stage_arc: slab_default
  anthropic_api_key: ""
  anthropic_model: claude-haiku-5-5
  anthropic_base_url: ""
  anthropic_daily_budget_usd: 1.0
  brain_dry_run: false
  ai_judges: all
  ai_daily_calls: 5000
  ai_budget_warn_pct: 80
  ai_reask_max: 2
  ai_unsure_below: 0.7
  ai_strict_after: 3
  ai_strict_prob: 0.8
  ai_flower_start: ""
  ai_flower_days: 56
schema:
  num_zones: int
  lights_on_hour: float
  lights_off_hour: float
  enable_flag: str
  notify_service: str?
  notify_min: float
  instance_name: str?
  feed_ec_sensor: str?
  feed_ph_sensor: str?
  sump_power_sensor: str?
  sump_silent_hours: float?
  pump_power_sensor: str?
  hold_entities:
    - str
  substrate_l: float
  flow_lps: float
  loop_seconds: float
  rediscover_seconds: float
  brain_provider: list(auto|rules|claude_haiku|jev_legacy)?
  stage_arc: list(slab_default)?
  anthropic_api_key: password?
  anthropic_model: str?
  anthropic_base_url: str?
  anthropic_daily_budget_usd: float(0,1000)?
  brain_dry_run: bool?
  ai_judges: str?
  ai_daily_calls: int?
  ai_budget_warn_pct: int?
  ai_reask_max: int?
  ai_unsure_below: float?
  ai_strict_after: int?
  ai_strict_prob: float?
  ai_flower_start: str?
  ai_flower_days: int?
  # Old keys: in the schema only, so a new install's form leaves them out and an old install's saved
  # value still loads. The keys of the removed first AI route (cf_*, typesafe_api_key, jev_enabled,
  # jev_retries) are read only to move that install to Claude or rules; each jev_* tuning key is read
  # as the old name of its ai_* key (brain_bridge.option), and jev_judges as described for ai_judges.
  cf_account_id: str?
  cf_api_token: password?
  cf_gateway_id: str?
  typesafe_api_key: password?
  jev_enabled: bool?
  jev_judges: str?
  jev_daily_calls: int?
  jev_budget_warn_pct: int?
  jev_retries: int?
  jev_reask_max: int?
  jev_unsure_below: float?
  jev_strict_after: int?
  jev_strict_prob: float?
  jev_flower_start: str?
  jev_flower_days: int?
