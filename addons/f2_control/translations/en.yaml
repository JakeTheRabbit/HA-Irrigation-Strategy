configuration:
  num_zones:
    name: Number of zones (fallback)
    description: >-
      The zones always come from the Crop Steering integration's room. This value is used
      only for a room whose valves are hand-mapped in the options file (the `hardware` key,
      which this form does not show). While Home Assistant cannot be reached at startup, no
      zone is driven until it answers. Add more probes per
      zone in the Crop Steering UI - the engine reads each zone's FUSED
      sensor.crop_steering_vwc_zone_N / ec_zone_N (an average of every probe you map).
  lights_on_hour:
    name: Lights-on hour (fallback)
    description: >-
      Lights are read live from the integration (number.crop_steering_lights_on_hour) so you
      set them ONCE in the Crop Steering UI. This option is only a fallback used if that
      entity is missing. Hour 0-23; lights-on starts the grow-day.
  lights_off_hour:
    name: Lights-off hour (fallback)
    description: >-
      Fallback only - lights are read live from the integration
      (number.crop_steering_lights_off_hour). Hour 0-23; at lights-off every zone is forced
      into the overnight dry-back phase (P3).
  enable_flag:
    name: Kill-switch entity
    description: >-
      The kill switch of a room with no saved setup (an installation from before the
      setup wizard). While it is OFF the engine reads sensors and makes decisions but
      NEVER opens a valve (the safe default). Turn it ON to go live. Leave as
      input_boolean.f2_control_enabled unless you named your helper something else.
      A room whose setup has been saved stops on the switch its setup names (its
      Engine Enabled switch); this option does not change that.
  notify_service:
    name: Notification service
    description: >-
      Where to send vitals, and alerts whenever no phone is set up under Crop Steering >
      Settings & help > Notifications (there, each phone chooses what it gets) or an
      alert can't be passed on there. Use the path form notify/<your_service>, for
      example notify/mobile_app_my_phone. Find yours in Developer Tools > Actions by
      typing "notify".
  notify_min:
    name: Minutes between routine notifications
    description: >-
      Minimum minutes between routine "vitals" messages so you are not spammed.
      Urgent alerts ignore this throttle. Default 30.
  instance_name:
    name: Name in notifications
    description: >-
      The title of the controller's vitals notifications, for example
      "Crop Steering vitals". Change it to tell two installations apart.
  feed_ec_sensor:
    name: Source-water EC sensor (optional)
    description: >-
      Entity id of your reservoir / source-water EC probe, e.g.
      sensor.my_reservoir_ec. When set, the engine gates irrigation on the feed
      EC being inside number.crop_steering_irrigation_ec_min / _max (fail-closed
      if the probe dies). LEAVE BLANK if you have no feed-EC probe - the
      source-water EC gate is then disabled, but dosing / tank-fill holds still
      apply.
  feed_ph_sensor:
    name: Source-water pH sensor (optional)
    description: >-
      Entity id of your reservoir / source-water pH probe, e.g.
      sensor.my_reservoir_ph. When set, the engine gates irrigation on the feed
      pH being inside number.crop_steering_irrigation_ph_min / _max (fail-closed
      if the probe dies). LEAVE BLANK if you have no feed-pH probe - the
      source-water pH gate is then disabled.
  hold_entities:
    name: Hold entities (optional)
    description: >-
      Entities that pause watering while they are on, such as the input_boolean
      a dosing or tank-fill automation turns on while it works. While any of them
      is on, no shot starts, and a shot already running ends and counts only the
      water it gave. One that is missing or unavailable also stops new shots
      until it reads again. Empty by default: nothing holds.
  substrate_l:
    name: Fallback substrate volume (L per plant)
    description: >-
      Last-resort fallback ONLY, used if the integration's per-zone
      substrate_volume number is unset. The generic default is a safe
      placeholder - set your real per-plant block size in the Crop Steering UI.
      Normally leave this: real shot sizing is read live from your per-zone
      hardware numbers (substrate_volume x plant_count).
  flow_lps:
    name: Fallback drip flow (L per second)
    description: >-
      Last-resort fallback ONLY, used if the per-zone flow cannot be computed
      from your plant count and dripper settings. The generic default is a safe
      placeholder. Normally leave this: real flow is
      plant_count x drippers_per_plant x dripper_flow_rate.
  loop_seconds:
    name: Decision interval (seconds)
    description: >-
      How often the engine wakes to read sensors and decide. Default 60. Lower
      reacts faster but makes more Home Assistant API calls.
  rediscover_seconds:
    name: Seconds between setup checks
    description: >-
      How often the controller looks for new rooms and for setup changes saved
      in the Crop Steering page. Default 300 (five minutes).
  brain_provider:
    name: AI assistant
    description: >-
      Which brain judges the engine's decisions. rules: none, the engine decides alone.
      claude_haiku: Claude Haiku, with the Anthropic API key below. jev_legacy
      (deprecated): the retired Jev routes, for an install that still has them. auto
      (default): keeps the Jev route on an install that has run it, and rules everywhere
      else, so a new install starts on rules.
  stage_arc:
    name: Stage arc
    description: >-
      The flower stage arc the AI assistant and the stage card follow once a flower start
      is set below (slab_default). With no flower start, no arc is used.
  anthropic_api_key:
    name: Anthropic API key (optional)
    description: >-
      Your own Anthropic API key, for brain_provider claude_haiku. Stored as a password and
      never shown or logged. Empty: no key, the engine runs on its own rules. The brain sends
      readings and settings to Anthropic, never entity ids or keys.
  anthropic_model:
    name: Claude model
    description: >-
      claude-haiku-5-5 (default), claude-sonnet-5-5 or claude-opus-5-5. Any other model runs
      rules, because this release cannot keep it to your budget.
  anthropic_daily_budget_usd:
    name: AI budget until lights-on (US$)
    description: >-
      The most the brain may spend between one lights-on and the next (default 1.00). Once it
      is spent, the engine runs on its own rules until the next lights-on (CS-708). 0: the
      brain never calls.
  brain_dry_run:
    name: AI advises only
    description: >-
      On: the brain judges and the log shows what it would have done, but it moves nothing;
      the engine runs exactly as on rules. Alerts still come through.
  cf_account_id:
    name: Cloudflare account ID (deprecated)
    description: >-
      A second route to Jev (typesafe/jev on Cloudflare Workers AI), which judges the
      engine's decisions in every phase inside the controller's safety envelope
      (docs/JEV.md). With this and the token below but no TypeSafe key, Jev starts only
      on an install that has already run it; a new install needs the TypeSafe key
      below. LEAVE BLANK to run the plain engine.
  cf_api_token:
    name: Cloudflare API token (deprecated)
    description: >-
      A Cloudflare API token with the Workers AI Read + Edit permission on the account
      above. Stored as a password. Irrigation never waits on this call: if Cloudflare is
      unreachable the controller carries on without a verdict.
  cf_gateway_id:
    name: Cloudflare AI Gateway ID (deprecated)
    description: >-
      Route the Jev calls through an AI Gateway (for logs and rate limits), e.g. default.
      Leave blank to call Workers AI directly.
  typesafe_api_key:
    name: TypeSafe API key (deprecated)
    description: >-
      A TypeSafe API key (apikey_...). When set, Jev is asked straight from TypeSafe and the
      Cloudflare fields above are not needed. Stored as a password.
  jev_enabled:
    name: Jev judges decisions (deprecated)
    description: >-
      Off runs the plain engine even with Cloudflare set. On (default) lets the judges
      below act, each only inside the controller's safety envelope.
  jev_judges:
    name: Jev judges that may act
    description: >-
      all (default), or a comma-separated list of dawn, ramp, salt, dusk, probe, shot,
      night, zones, stage, setpoints, balance (Claude route only) and alerts. A judge
      not listed is never asked.
      Setpoints also needs the room's Auto setpoints switch on.
  jev_daily_calls:
    name: Jev calls a day
    description: >-
      The most calls Jev gets in a day across every room (default 5000). Once spent,
      the engine decides alone until midnight.
  jev_budget_warn_pct:
    name: Warn at this share of Jev's calls (%)
    description: >-
      When the day's calls reach this share of the budget above (default 80), the app
      raises CS-706, once that day.
  jev_retries:
    name: Tries per Jev route (deprecated)
    description: >-
      How many times each route to Jev is tried while it is busy, failing or slow
      (default 3), inside 60 seconds. A refused key moves straight on to the next route.
  jev_reask_max:
    name: Second looks when Jev is unsure
    description: >-
      When an answer that did not act is under the sureness below, or its two phrasings
      disagree, Jev is asked again with more evidence, up to this many times (default 2).
      Then the engine decides.
  jev_unsure_below:
    name: Jev is unsure below
    description: >-
      An answer with a probability under this (default 0.7) is unsure, and is asked again.
  jev_strict_after:
    name: Bad calls before the stricter gate
    description: >-
      After this many of a judge's calls in a row did not work out for a zone (default 3),
      that judge acts there only when it is very sure and a second look agrees, until two
      calls in a row work. The app raises CS-707.
  jev_strict_prob:
    name: Sureness on the stricter gate
    description: >-
      How sure an answer must be to act on the stricter gate (default 0.8).
  jev_flower_start:
    name: Flower start (Jev's stage arc)
    description: >-
      Where each room's first day of 12/12 is, so the judges know the stage: an
      input_datetime or a date for every room, or room=value pairs, e.g.
      default=input_datetime.flower_start, room_b=input_datetime.room_b_flower_start. Blank: the
      judges work without a stage.
  sump_power_sensor:
    name: Sump pump power sensor (optional)
    description: >-
      The power reading of the sump pump the room's tables drain to, e.g. sensor.sump_pump_power, in
      W, kW or mW; for more than one room, room=sensor pairs, e.g.
      default=sensor.sump_pump_power, veg=sensor.veg_sump_power. When set, a pump that shows no run
      (no reading above the room's Sump Pump Run Threshold, 20 W unless changed) for the hours below
      while the room is on raises CS-311 (critical): the tables are about to back up. Blank: not
      watched.
  sump_silent_hours:
    name: Sump pump may stand still for (hours)
    description: >-
      How long the sump pump may show no run before CS-311 (default 3). Set it longer than the
      longest normal gap between its runs.
  jev_flower_days:
    name: Days of flower
    description: >-
      The cultivar's flowering length (default 56). The finish is its last 14 days.
