<!doctype html>
<html
  lang="en"
  data-resolution="landscape"
  data-composition-variables='[
    {"id":"lessonId","type":"string","label":"Lesson code","default":"A1"},
    {"id":"title","type":"string","label":"Lesson title","default":"Before the buttons: water, roots and air"},
    {"id":"module","type":"string","label":"Module","default":"Foundations"},
    {"id":"part","type":"string","label":"Part line","default":"Lesson 1 of 24"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #f7f7ef; }
      #root { position: relative; width: 100%; height: 100%; font-family: "DM Sans", "Segoe UI", system-ui, sans-serif; color: #233e34; }
      .band { position: absolute; left: 0; top: 0; bottom: 0; width: 760px; background: #183e35; transform-origin: left center; }
      .soil { position: absolute; left: 150px; bottom: 210px; width: 460px; height: 120px; border-radius: 0 0 70px 70px; background: #a07a52; }
      .soil::before { content: ""; position: absolute; left: -20px; right: -20px; top: -14px; height: 28px; border-radius: 14px; background: #7a5a3a; }
      .stem { position: absolute; left: 372px; bottom: 330px; width: 16px; height: 360px; border-radius: 8px; background: #8fc79c; transform-origin: bottom center; }
      .leaf { position: absolute; width: 190px; height: 92px; border-radius: 100% 0; background: #8fc79c; }
      .leaf.l { left: 196px; bottom: 560px; transform-origin: right center; }
      .leaf.r { left: 388px; bottom: 470px; border-radius: 0 100%; transform-origin: left center; background: #b5dcbd; }
      .drop { position: absolute; left: 360px; top: 120px; width: 40px; height: 54px; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; background: #4f9fd8; }
      .badge { position: absolute; left: 860px; top: 250px; padding: 14px 30px; border-radius: 999px; background: #183e35; color: #fffef9; font-size: 44px; font-weight: 700; letter-spacing: 4px; }
      .module { position: absolute; left: 1100px; top: 262px; font-size: 34px; font-weight: 700; letter-spacing: 6px; color: #b6a66f; text-transform: uppercase; }
      .title { position: absolute; left: 860px; top: 370px; width: 960px; font-family: "Libre Caslon Display", Georgia, serif; font-size: 92px; line-height: 1.08; color: #183e35; }
      .part { position: absolute; left: 860px; bottom: 170px; font-size: 32px; color: #53645a; }
      .rule { position: absolute; left: 860px; bottom: 236px; width: 960px; height: 4px; background: #d1d8c9; transform-origin: left center; }
      .brand { position: absolute; left: 150px; bottom: 110px; color: #fffef9; font-size: 34px; letter-spacing: 3px; font-weight: 600; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4" data-width="1920" data-height="1080">
      <div class="band clip" data-start="0" data-duration="4"></div>
      <div class="drop clip" data-start="0" data-duration="4"></div>
      <div class="soil clip" data-start="0" data-duration="4"></div>
      <div class="stem clip" data-start="0" data-duration="4"></div>
      <div class="leaf l clip" data-start="0" data-duration="4"></div>
      <div class="leaf r clip" data-start="0" data-duration="4"></div>
      <div class="brand clip" data-start="0" data-duration="4">CROP STEERING ACADEMY</div>
      <div id="badge" class="badge clip" data-start="0" data-duration="4"></div>
      <div id="module" class="module clip" data-start="0" data-duration="4"></div>
      <div id="title" class="title clip" data-start="0" data-duration="4"></div>
      <div class="rule clip" data-start="0" data-duration="4"></div>
      <div id="part" class="part clip" data-start="0" data-duration="4"></div>
    </div>
    <script>
      const v = window.__hyperframes.getVariables();
      document.getElementById("badge").textContent = v.lessonId;
      document.getElementById("module").textContent = v.module;
      document.getElementById("title").textContent = v.title;
      document.getElementById("part").textContent = v.part;
      // Shift the module label so it always sits just right of the badge.
      document.getElementById("module").style.left = 860 + document.getElementById("badge").offsetWidth + 36 + "px";

      const tl = gsap.timeline({ paused: true });
      tl.fromTo(".band", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power3.out" }, 0)
        .fromTo(".soil", { y: 80, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "back.out(1.6)" }, 0.25)
        .fromTo(".drop", { y: -160, opacity: 0 }, { y: 360, opacity: 1, duration: 0.7, ease: "power2.in" }, 0.35)
        .to(".drop", { opacity: 0, scale: 1.6, duration: 0.15 }, 1.05)
        .fromTo(".stem", { scaleY: 0 }, { scaleY: 1, duration: 0.9, ease: "power2.out" }, 1.05)
        .fromTo(".leaf.l", { scale: 0, rotation: 25 }, { scale: 1, rotation: 0, duration: 0.6, ease: "back.out(1.8)" }, 1.6)
        .fromTo(".leaf.r", { scale: 0, rotation: -25 }, { scale: 1, rotation: 0, duration: 0.6, ease: "back.out(1.8)" }, 1.45)
        .to(".leaf.l", { rotation: -4, duration: 1.4, ease: "sine.inOut", yoyo: true, repeat: 1 }, 2.2)
        .to(".leaf.r", { rotation: 4, duration: 1.4, ease: "sine.inOut", yoyo: true, repeat: 1 }, 2.2)
        .fromTo(".brand", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.5 }, 0.6)
        .fromTo("#badge", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "back.out(2)" }, 0.5)
        .fromTo("#module", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.45 }, 0.75)
        .fromTo("#title", { opacity: 0, y: 50 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.9)
        .fromTo(".rule", { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "power2.out" }, 1.4)
        .fromTo("#part", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5 }, 1.7)
        .to(["#title", "#badge", "#module", "#part", ".rule"], { opacity: 0, duration: 0.35 }, 3.6);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
