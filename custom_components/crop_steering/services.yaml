test_shot:
  name: Test zone shot
  description: >-
    Asks the controller for a 10 s test shot in one zone. It does the same as the Test Shot button
    of the zone. Opens the zone valve and runs the pump for 10 s. The shot passes every check of a
    normal shot, except a hold from a grow plan. When a signed-in user calls it, that user must be a
    Home Assistant administrator. An automation can call it without this check. Watch the drippers
    of the zone during the test. The controller does not act on a request that it sees more than 10
    min late. After the test, record the result in the setup wizard. WARNING: Tell each person near
    the pump and the zone before the test. The pump starts and the zone valve opens. CAUTION: Make
    sure that the drippers of the zone are in their pots or in a catch container. A test shot can
    spill water.
  fields:
    room_id:
      name: Room ID
      description: >-
        The canonical ID of the room: `room:` for the default room, or `room:` and the room prefix for a
        named room. A different ID tests a different room. The integration refuses an unknown ID.
        Example: `room:f1_` for a named room, or `room:` for the default room.
      required: true
      selector:
        text:
    zone:
      name: Zone
      description: >-
        The number of the zone to test. A different number tests a different zone. Range: 1 to 99. The
        integration refuses a zone that the room does not have.
      required: true
      selector:
        number:
          min: 1
          max: 99
          mode: box
stop_all:
  name: Stop all
  description: >-
    Stops all water in one room at once. It does the same as the Stop all button of the room. It sets
    the kill switch of the room to off, then sets the pump, the main-line valve, the waste valve and
    every zone valve of the room to off, and reads each one back. It works when the controller app is
    stopped. It never switches anything on. Any user can call it. A device that does not read off
    within 10 s gives a notification (CS-308). CAUTION: A pump that the room shares with another room
    or with the batch tank also stops. To water again, set the kill switch to on.
  fields:
    room_id:
      name: Room ID
      description: >-
        The canonical ID of the room: `room:` for the default room, or `room:` and the room prefix for a
        named room. The integration refuses an unknown ID. Example: `room:f1_` for a named room, or
        `room:` for the default room.
      required: true
      selector:
        text:
whats_new_get:
  name: Read what's new
  description: >-
    Returns the release highlights of the integration, the installed version and the last release
    that the "What's new" window showed. Changes nothing. It has no administrator check. The
    dashboard calls it.
whats_new_seen:
  name: Mark what's new as shown
  description: >-
    Records that the "What's new" window showed the highlights up to this version. The record is for
    the full installation. The window does not show these highlights again to any user. It changes
    nothing else. It has no administrator check. The dashboard calls it.
  fields:
    version:
      name: Version
      description: >-
        The last version that the window showed. A higher version stops the window for more releases.
        Format: X.Y.Z. Example: 2.25.0.
      required: true
      example: "2.25.0"
      selector:
        text:
brain_ask:
  name: Ask the AI assistant why
  description: >-
    Asks the AI assistant of the room why the controller or the AI assistant did something. The
    controller gives the answer on the answers sensor of the room. Stores the question and spends
    from the AI budget of the room. A room can ask 20 questions each calendar day. Only the Claude
    Haiku model of the AI assistant answers questions. When a signed-in user calls it, that user
    must be a Home Assistant administrator. An automation can call it without this check. Ask about
    one decision, and give the zone when the question is about one zone. The controller does not ask
    a question that waited for more than 1 h.
  fields:
    room_id:
      name: Room ID
      description: >-
        The canonical ID of the room: `room:` for the default room, or `room:` and the room prefix for a
        named room. A different ID asks a different room. The integration refuses an unknown ID.
        Example: `room:f1_` for a named room, or `room:` for the default room.
      required: true
      example: "room:"
      selector:
        text:
    question:
      name: Question
      description: >-
        The question to ask, in plain words. The AI assistant answers this text. Maximum: 300
        characters. Example: Why did zone 1 not water after lights-on?
      required: true
      example: "Why did zone 1 not water after lights-on?"
      selector:
        text:
          multiline: true
    zone:
      name: Zone
      description: >-
        The zone that the question is about. The integration stores the question with this zone number.
        Optional. Range: 1 to 24. Example: 1.
      required: false
      selector:
        number:
          min: 1
          max: 24
          mode: box

grow_day_record:
  name: Record grow-day summaries
  description: >-
    Stores one summary for each zone and grow-day in the grow-day store of the room. The controller
    app sends them at lights-on while the Record grow days switch of the room is on. A summary for a
    zone and a date that is already stored replaces it. Changes no setting and no watering. When a
    signed-in user calls it, that user must be a Home Assistant administrator.
  fields:
    room_id:
      name: Room ID
      description: >-
        The canonical ID of the room: `room:` for the default room, or `room:` and the room prefix for a
        named room. The integration refuses an unknown ID. Example: `room:f1_`.
      required: true
      selector:
        text:
    days:
      name: Summaries
      description: >-
        A list of grow-day summaries, each with at least a date (YYYY-MM-DD) and a zone (1 to 24). At
        most 336 in one call.
      required: true
      selector:
        object:

grow_days_get:
  name: Read grow-day summaries
  description: >-
    Returns the grow-day summaries of the room, oldest first. Changes nothing. It has no administrator
    check.
  fields:
    room_id:
      name: Room ID
      description: >-
        The canonical ID of the room: `room:` for the default room, or `room:` and the room prefix for a
        named room. Example: `room:f1_`.
      required: true
      selector:
        text:
    start:
      name: First grow-day
      description: The first grow-day to return, YYYY-MM-DD. Left out, from the oldest.
      required: false
      selector:
        text:
    end:
      name: Last grow-day
      description: The last grow-day to return, YYYY-MM-DD. Left out, to the newest.
      required: false
      selector:
        text:
    zone:
      name: Zone
      description: Only this zone. Left out, every zone.
      required: false
      selector:
        number:
          min: 1
          max: 24
          mode: box

grow_days_backfill:
  name: Fill grow-days from statistics
  description: >-
    Adds a summary for each zone and grow-day from the start to the end date that has none, from the
    long-term statistics of Home Assistant: the lowest, highest and mean moisture and EC of the zone,
    and its water. These summaries are marked as backfilled. The dryback, the shots and the readings of
    each probe cannot be filled. A recorded summary is never replaced. When a signed-in user calls it,
    that user must be a Home Assistant administrator.
  fields:
    room_id:
      name: Room ID
      description: >-
        The canonical ID of the room: `room:` for the default room, or `room:` and the room prefix for a
        named room. Example: `room:f1_`.
      required: true
      selector:
        text:
    start:
      name: First grow-day
      description: The first grow-day to fill, YYYY-MM-DD.
      required: true
      selector:
        text:
    end:
      name: Last grow-day
      description: The last grow-day to fill, YYYY-MM-DD. At most 401 grow-days after the first.
      required: true
      selector:
        text:

display_get:
  name: Read display options
  description: >-
    Returns the display options of the room: which extra panels the dashboard shows. Every option
    is off until an administrator turns it on. Changes nothing. It has no administrator check. Use
    it to read the revision before you save.
  fields:
    room_id:
      name: Room ID
      description: >-
        The canonical ID of the room: `room:` for the default room, or `room:` and the room prefix for a
        named room. A different ID reads a different room. The integration refuses an unknown ID.
        Example: `room:f1_` for a named room, or `room:` for the default room.
      required: true
      selector:
        text:

display_save:
  name: Save display options
  description: >-
    Turns display options of the room on or off. The options only select which panels the
    dashboard shows. They do not change watering, a setpoint or hardware. Everyone who opens the
    room sees the result. When a signed-in user calls it, that user must be a Home Assistant
    administrator. An automation can call it without this check. Give the revision that you read
    with display_get. The integration refuses the save when the options changed after you read them.
  fields:
    room_id:
      name: Room ID
      description: >-
        The canonical ID of the room: `room:` for the default room, or `room:` and the room prefix for a
        named room. Example: `room:f1_`.
      required: true
      selector:
        text:
    expected_revision:
      name: Expected revision
      description: >-
        The revision that display_get returned. Example: 0.
      required: true
      selector:
        number:
          min: 0
          max: 1000000
          mode: box
    options:
      name: Options
      description: >-
        The options to change, each with its new value. A switch option takes true or false.
        today_zone_layout takes "cards" or "table". Example: {"show_climate": true}.
      required: true
      selector:
        object:
supply_get:
  name: Read supply settings
  description: >-
    Returns the site's supply settings: the irrigation pumps with their output and how many zones
    each may feed at once, the water sources, the exclusive groups of zones and the flow meter of
    each zone, with a capacity check (the worst case each pump must carry and, for every pair of
    zones on a pump, whether they can run together). Changes nothing. It has no administrator
    check. Use it to read the revision before you save.

supply_save:
  name: Save supply settings
  description: >-
    Replaces the site's pumps, and optionally its water sources, exclusive groups and zone flow
    meters. The integration refuses with pump_over_capacity when a pump is set to feed more zones
    at once than its output can carry, and says how many it can. When a signed-in user calls it,
    that user must be a Home Assistant administrator. An automation can call it without this
    check. Give the revision that you read with supply_get. The integration refuses the save when
    the settings changed after you read them. With preview it checks and answers with the
    difference and the capacity check, and saves nothing.
  fields:
    expected_revision:
      name: Expected revision
      description: >-
        The revision that supply_get returned. Example: 0.
      required: true
      selector:
        number:
          min: 0
          max: 1000000
          mode: box
    irrigation_pumps:
      name: Irrigation pumps
      description: >-
        The pumps, each as entity_id (the pump switch of the rooms that use it), max_flow_lph
        (optional), max_concurrent_zones (1 or more, default 1) and flow_meter (optional).
        Example: [{"entity_id": "switch.pump", "max_flow_lph": 1200, "max_concurrent_zones": 2}].
      required: true
      selector:
        object:
    water_sources:
      name: Water sources
      description: >-
        The water sources, as a list. Left out, the saved ones are kept.
      required: false
      selector:
        object:
    zone_groups:
      name: Exclusive groups
      description: >-
        The exclusive group of each zone, by room and zone number. Zones in one group never run
        together. Left out, the saved groups are kept. Example: {"room:f2_": {"3": "a"}}.
      required: false
      selector:
        object:
    zone_meters:
      name: Zone flow meters
      description: >-
        The flow meter of each zone, by room and zone number. Left out, the saved meters are kept.
        Example: {"room:f2_": {"3": "sensor.f2_meter_3"}}.
      required: false
      selector:
        object:
    preview:
      name: Preview
      description: Check and answer without saving.
      required: false
      selector:
        boolean:

harvests_get:
  name: Read harvests
  description: >-
    Returns the harvest of each run of the room that has one: the harvest date, the wet and dry
    weight of the room and of each zone, plants harvested, canopy area, plant entries, the quality
    grade, notes and lab results. Changes nothing. It has no administrator check.
  fields:
    room_id:
      name: Room ID
      description: >-
        The canonical ID of the room: `room:` for the default room, or `room:` and the room prefix for a
        named room. Example: `room:f1_`.
      required: true
      selector:
        text:

runs_set_harvest:
  name: Save the harvest of a run
  description: >-
    Saves, replaces or removes the harvest of one run. Every field of the harvest is optional.
    Changes no setting and no watering. When a signed-in user calls it, that user must be a Home
    Assistant administrator. Read the revision with `harvests_get` first.
  fields:
    room_id:
      name: Room ID
      description: >-
        The canonical ID of the room: `room:` for the default room, or `room:` and the room prefix for a
        named room. Example: `room:f1_`.
      required: true
      selector:
        text:
    expected_revision:
      name: Expected revision
      description: >-
        The revision that `harvests_get` returned. When the stored revision is different, the
        integration refuses the call and changes nothing. Minimum: 0.
      required: true
      selector:
        number:
          min: 0
          mode: box
    run_id:
      name: Run ID
      description: The ID of the run. Get it from `runs_get`.
      required: true
      selector:
        text:
    harvest:
      name: Harvest
      description: >-
        The harvest: harvest_date (YYYY-MM-DD); room and zones ({"1": {...}}) each with wet_weight_g,
        dry_weight_g, plants_harvested and canopy_m2; plants (label, zone, wet_g, dry_g; at most 500);
        quality (up to 40 characters); notes (up to 500); lab (thc_pct, terpenes as name and number,
        at most 20). Empty (null) removes the harvest.
      required: true
      selector:
        object:
history_connection_get:
  name: Read long history connection
  description: Returns the room history source and connection fields with secrets removed. Requires a signed-in administrator.
  fields:
    room_id:
      name: Room ID
      description: Canonical room ID.
      required: true
      selector:
        text:
history_connection_save:
  name: Save long history connection
  description: Tests and saves an optional read-only InfluxDB connection. Recorder is the default. Requires a signed-in administrator.
  fields:
    room_id:
      name: Room ID
      required: true
      selector:
        text:
    expected_revision:
      name: Expected revision
      required: true
      selector:
        number:
          min: 0
          mode: box
    connection:
      name: Connection
      required: true
      selector:
        object:
history_long:
  name: Read long history
  description: Reads at most four mapped sensors, 1000 downsampled points each and 366 days from InfluxDB. Requires a signed-in administrator. Never writes to InfluxDB.
  fields:
    room_id:
      name: Room ID
      required: true
      selector:
        text:
    entity_ids:
      name: Sensor entities
      required: true
      selector:
        object:
    start:
      name: Start timestamp
      required: true
      selector:
        text:
    end:
      name: End timestamp
      required: true
      selector:
        text:

brain_prompt_get:
  name: Read AI instructions
  description: Read saved room context, history and the controller's published prompt snapshot.
  fields:
    room_id:
      name: Room
      description: Canonical room id, such as room:tent_.
      required: true
      selector:
        text:
brain_prompt_save:
  name: Save AI instructions
  description: Administrator-only revisioned context and cache preferences; never changes shipped doctrine or safety rules.
  fields:
    room_id:
      name: Room
      description: Canonical room id.
      required: true
      selector:
        text:
    expected_revision:
      name: Expected revision
      description: Last revision read by the editor.
      required: true
      selector:
        number:
          min: 0
          mode: box
    config:
      name: Configuration
      description: Notes, structured profile and cache preferences.
      required: true
      selector:
        object:
brain_prompt_rollback:
  name: Restore saved AI instructions
  description: Administrator-only restore of a previous revision as a new version.
  fields:
    room_id:
      name: Room
      description: Canonical room id.
      required: true
      selector:
        text:
    expected_revision:
      name: Expected revision
      description: Current revision.
      required: true
      selector:
        number:
          min: 0
          mode: box
    revision:
      name: Revision to restore
      description: Previous revision in the room history.
      required: true
      selector:
        number:
          min: 0
          mode: box
brain_prompt_rebuild:
  name: Rebuild local AI prompt
  description: Administrator-only request for local regeneration next controller pass; never purges a provider cache or makes a paid call.
  fields:
    room_id:
      name: Room
      description: Canonical room id.
      required: true
      selector:
        text:
    expected_revision:
      name: Expected revision
      description: Current revision.
      required: true
      selector:
        number:
          min: 0
          mode: box
brain_prompt_publish:
  name: Publish controller AI prompt
  description: Controller-only administrator publication of the actual built prompt snapshot with verified block hashes.
  fields:
    room_id:
      name: Room
      description: Canonical room id.
      required: true
      selector:
        text:
    expected_revision:
      name: Expected revision
      description: Configuration revision used to build the prompt.
      required: true
      selector:
        number:
          min: 0
          mode: box
    live:
      name: Built prompt
      description: Controller-built A/B/C text, SHA-256 hashes and source paths.
      required: true
      selector:
        object:
journal_append:
  name: Append journal events
  description: Administrator-only. Stores up to 50 events for a room, idempotent on the event id, and re-fires each new one on the bus as crop_steering_event.
  fields:
    room_id:
      name: Room
      description: Canonical room id, "room:" plus the room prefix.
      required: true
      selector:
        text:
    events:
      name: Events
      description: Up to 50 version 1 events.
      required: true
      selector:
        object:
journal_query:
  name: Query the journal
  description: Reads a room's events in time order. Any signed-in user. Returns the events and a cursor for the next page, or null.
  fields:
    room_id:
      name: Room
      description: Canonical room id, "room:" plus the room prefix.
      required: true
      selector:
        text:
    since:
      name: Since
      description: ISO-8601 start time, inclusive.
      required: true
      selector:
        text:
    until:
      name: Until
      description: ISO-8601 end time, exclusive.
      required: false
      selector:
        text:
    kinds:
      name: Kinds
      description: Only these event kinds.
      required: false
      selector:
        object:
    zones:
      name: Zones
      description: Only these zone numbers.
      required: false
      selector:
        object:
    actor:
      name: Actor
      description: Only events from this actor.
      required: false
      selector:
        text:
    limit:
      name: Limit
      description: Most events to return, 1 to 500.
      required: false
      selector:
        number:
          min: 1
          max: 500
          mode: box
    cursor:
      name: Cursor
      description: The cursor a previous page returned.
      required: false
      selector:
        text:

timer_program_set:
  name: Save a timer program
  description: >-
    Adds a timer program to the room, or changes one when the program has an id. A zone may belong
    to one active timer program only. The controller app runs a program for the zones whose
    Watering by select reads timer. When a signed-in user calls it, that user must be a Home
    Assistant administrator. Give the revision that you read with timer_program_list. Answers with
    the saved program, the new revision and its shots over the next 24 hours.
  fields:
    room_id:
      name: Room ID
      description: >-
        The canonical ID of the room: `room:` for the default room, or `room:` and the room prefix
        for a named room. Example: `room:f2_`.
      required: true
      selector:
        text:
    expected_revision:
      name: Expected revision
      description: >-
        The revision that timer_program_list returned. Example: 0.
      required: true
      selector:
        number:
          min: 0
          max: 1000000
          mode: box
    program:
      name: Program
      description: >-
        The program: name, type (recycle, simple or one_off), zones, duration_s, active, window
        ({"kind": "all"}, lights_on, lights_off, or custom with from and to as HH:MM), and
        interval_min with an optional sync_time (recycle), frequency_per_day (simple) or start_at
        (one_off). Example: {"name": "Mothers AM", "type": "recycle", "zones": [1], "duration_s":
        120, "interval_min": 30, "window": {"kind": "custom", "from": "08:00", "to": "12:00"}}.
      required: true
      selector:
        object:

timer_program_delete:
  name: Delete a timer program
  description: >-
    Switches a timer program off and marks it deleted. It stays in the store for its history and is
    no longer listed. When a signed-in user calls it, that user must be a Home Assistant
    administrator.
  fields:
    room_id:
      name: Room ID
      description: >-
        The canonical ID of the room. Example: `room:f2_`.
      required: true
      selector:
        text:
    expected_revision:
      name: Expected revision
      description: >-
        The revision that timer_program_list returned. Example: 3.
      required: true
      selector:
        number:
          min: 0
          max: 1000000
          mode: box
    id:
      name: Program ID
      description: The id of the program to delete.
      required: true
      selector:
        text:

timer_program_preview:
  name: Preview a timer program
  description: >-
    Checks a timer program, saved or a draft without an id, and answers with the shots it would
    give over the coming hours, how many and their total seconds. Saves nothing. It has no
    administrator check.
  fields:
    room_id:
      name: Room ID
      description: >-
        The canonical ID of the room. Example: `room:f2_`.
      required: true
      selector:
        text:
    program:
      name: Program
      description: The program, as timer_program_set takes it.
      required: true
      selector:
        object:
    hours:
      name: Hours
      description: How many hours ahead, up to 48. Default 24.
      required: false
      selector:
        number:
          min: 1
          max: 48
          mode: box

timer_program_list:
  name: List timer programs
  description: >-
    Returns the room's timer programs that are not deleted, each with its next shot and the zones
    whose Watering by select reads timer, and the revision to save against. Without a room it
    returns every room's programs, each with its room_id, and each room's revision. Changes
    nothing. It has no administrator check.
  fields:
    room_id:
      name: Room ID
      description: >-
        The canonical ID of the room. Leave it out for every room. Example: `room:f2_`.
      required: false
      selector:
        text:

timer_skip:
  name: Skip a planned shot
  description: >-
    Skips the planned shot of one zone at a given time: the timer shot, or the engine shot the
    timeline showed then. Rescue and emergency shots are never skipped. The time may be up to 48
    hours ahead. The skip covers 15 minutes from that time and is dropped 24 hours after it. When a signed-in user calls it, that user must be a Home Assistant administrator.
  fields:
    room_id:
      name: Room ID
      description: >-
        The canonical ID of the room. Example: `room:f2_`.
      required: true
      selector:
        text:
    expected_revision:
      name: Expected revision
      description: >-
        The revision that timer_program_list returned. Example: 3.
      required: true
      selector:
        number:
          min: 0
          max: 1000000
          mode: box
    zone:
      name: Zone
      description: >-
        The zone number. Example: 3.
      required: true
      selector:
        number:
          min: 1
          max: 24
          mode: box
    at:
      name: At
      description: >-
        The time of the planned shot, as an ISO date and time with its offset. Example:
        2026-10-22T08:00:00+13:00.
      required: true
      selector:
        text:
