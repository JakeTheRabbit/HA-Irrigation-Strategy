apply_recipe:
  name: Apply recipe stage
  description: >-
    Write a named-stage recipe's setpoints into the per-zone number entities the
    engine reads (VWC targets, dryback, EC targets, EC ceiling, P2 shot size).
    Operator-initiated; values are clamped by each number's min/max and the kill
    switch still gates actuation. Omit the stage to re-apply the active one.
    Needs a Home Assistant administrator when a signed-in user calls it, directly
    or through a script they start; automations are unaffected.
  fields:
    stage:
      name: Stage
      description: Recipe stage to apply. Defaults to the active stage.
      required: false
      selector:
        select:
          options:
            - "Veg"
            - "Transition"
            - "Bulk"
            - "Ripen"
            - "Custom"

save_recipe:
  name: Save recipe table
  description: >-
    Replace the stored recipe table (stage -> setpoints) for every room. Used by
    the dashboard recipe editor; does not change any live setpoint until a stage
    is applied. Needs a Home Assistant administrator when a signed-in user calls
    it, directly or through a script they start; automations are unaffected.
  fields:
    recipe:
      name: Recipe
      description: The full recipe object (version, active_stage, stages).
      required: true
      selector:
        object:

set_manual_override:
  name: Set manual override
  description: >-
    Pause automatic irrigation for one zone until the timeout expires, including
    across Home Assistant restarts. The default is 60 minutes. Disable clears the
    hold immediately; turning the switch on directly creates an indefinite hold.
    Needs a Home Assistant administrator when a signed-in user calls it, directly
    or through a script they start; automations are unaffected.
  fields:
    zone:
      name: Zone
      description: Zone number.
      required: true
      selector:
        number:
          min: 1
          max: 24
          mode: box
    timeout_minutes:
      name: Timeout
      description: Auto-clear after this many minutes; defaults to 60 (max 24 h).
      default: 60
      required: false
      selector:
        number:
          min: 1
          max: 1440
          unit_of_measurement: min
          mode: box
    enable:
      name: Enable
      description: True to enable the override, false to clear it.
      required: false
      selector:
        boolean:
    room:
      name: Room
      description: Room slug for multi-room installs. Omit for the default room.
      required: false
      selector:
        text:

setup_read:
  name: Read room setup
  description: Return setup capabilities, room configuration and searchable devices. Requires an administrator and a service response.

setup_create:
  name: Add room
  description: Create a room through the Home Assistant config flow, after validating mapping and verified OFF hardware. Does not enable irrigation.
  fields:
    room_name:
      required: true
      selector:
        text:
    zones:
      required: true
      selector:
        object:
    hardware:
      selector:
        object:

setup_save:
  name: Save room setup
  description: Update one room without changing its IDs. All affected engines and mapped hardware must read OFF. Set active true to restore an archived room.
  fields:
    entry_id:
      required: true
      selector:
        text:
    expected_revision:
      required: true
      selector:
        number:
          min: 0
          max: 2147483647
          mode: box
    room_name:
      required: true
      selector:
        text:
    active:
      selector:
        boolean:
    zones:
      required: true
      selector:
        object:
    hardware:
      selector:
        object:

setup_remove:
  name: Archive room
  description: Archive the explicitly selected room after verified OFF checks. Preserves entry IDs, mappings and controller counters for restoration.
  fields:
    entry_id:
      required: true
      selector:
        text:
    expected_revision:
      required: true
      selector:
        number:
          min: 0
          max: 2147483647
          mode: box
    confirm_name:
      required: true
      selector:
        text:

strategy_get:
  name: Read grow strategy
  description: Return the room's durable draft, active snapshot, and readable parameter bounds.
  fields:
    room_id:
      name: Room ID
      description: "Canonical room identity: room: for the default or room:f1_ for a named room."
      required: true
      selector:
        text:

strategy_save:
  name: Save grow strategy draft
  description: Validate and save grower-defined endpoints and daily or weekly zone assignments. Does not activate watering. Needs a Home Assistant administrator when a signed-in user calls it, directly or through a script they start; automations are unaffected.
  fields:
    room_id:
      required: true
      selector:
        text:
    expected_revision:
      description: Revision returned by strategy_get; rejects stale edits.
      required: true
      selector:
        number:
          min: 0
          mode: box
    plan:
      description: Version 1 plan with profiles and per-zone schedules.
      required: true
      selector:
        object:

strategy_preview:
  name: Preview grow strategy
  description: Interpolate explicit endpoints and calculate hydraulic shot volumes and durations without writes.
  fields:
    room_id:
      required: true
      selector:
        text:
    plan:
      required: false
      selector:
        object:
    date:
      description: Optional local grow-day date, YYYY-MM-DD.
      required: false
      selector:
        text:

strategy_activate:
  name: Arm grow strategy
  description: Arm a saved draft for the next local lights-on boundary. Requires a compatible controller and readable configuration; never enables hardware. Needs a Home Assistant administrator when a signed-in user calls it, directly or through a script they start; automations are unaffected.
  fields:
    room_id:
      required: true
      selector:
        text:
    expected_revision:
      required: true
      selector:
        number:
          min: 0
          mode: box

strategy_disarm:
  name: Disarm grow strategy
  description: Cancel an unstarted plan or return an active plan to legacy setpoints at the next lights-on boundary. Use the engine control to stop irrigation eligibility. Needs a Home Assistant administrator when a signed-in user calls it, directly or through a script they start; automations are unaffected.
  fields:
    room_id:
      required: true
      selector:
        text:

runs_get:
  name: Read run records
  description: Read this room's recorded run metadata. Does not enable irrigation.
  fields:
    room_id:
      required: true
      selector:
        text:
runs_save:
  name: Save run record
  description: Register a run with current reference metadata, or edit its dates and name while preserving the original reference. Needs a Home Assistant administrator when a signed-in user calls it, directly or through a script they start; automations are unaffected.
  fields:
    room_id:
      required: true
      selector:
        text:
    expected_revision:
      required: true
      selector:
        number:
          min: 0
          mode: box
    record:
      required: true
      selector:
        object:
runs_archive:
  name: Archive or restore run record
  description: Change run visibility without deleting historical reference metadata. Needs a Home Assistant administrator when a signed-in user calls it, directly or through a script they start; automations are unaffected.
  fields:
    room_id:
      required: true
      selector:
        text:
    expected_revision:
      required: true
      selector:
        number:
          min: 0
          mode: box
    id:
      required: true
      selector:
        text:
    archived:
      required: true
      selector:
        boolean:
runs_import:
  name: Import run records
  description: Import at most 100 validated metadata records for the same room. Recorder history is not included. Needs a Home Assistant administrator when a signed-in user calls it, directly or through a script they start; automations are unaffected.
  fields:
    room_id:
      required: true
      selector:
        text:
    expected_revision:
      required: true
      selector:
        number:
          min: 0
          mode: box
    runs:
      required: true
      selector:
        object:
stock_get:
  name: Read stock tanks
  description: Read this room's stock tanks, their levels, what one batch takes from each, and the batches recorded. Does not change anything.
  fields:
    room_id:
      required: true
      selector:
        text:
stock_save:
  name: Save stock tanks
  description: Replace this room's list of stock tanks (name, capacity, level, dose per batch, dose entity, low mark). A tank left out is removed. Needs a Home Assistant administrator when a signed-in user calls it, directly or through a script they start; automations are unaffected.
  fields:
    room_id:
      required: true
      selector:
        text:
    expected_revision:
      required: true
      selector:
        number:
          min: 0
          mode: box
    tanks:
      required: true
      selector:
        object:
stock_refill:
  name: Refill a stock tank
  description: Record that a stock tank was refilled to capacity, or set the level read off its side. Needs a Home Assistant administrator when a signed-in user calls it, directly or through a script they start; automations are unaffected.
  fields:
    room_id:
      required: true
      selector:
        text:
    expected_revision:
      required: true
      selector:
        number:
          min: 0
          mode: box
    id:
      required: true
      selector:
        text:
    level_l:
      required: false
      selector:
        number:
          min: 0
          max: 10000
          step: 0.1
          unit_of_measurement: L
          mode: box
stock_record_batch:
  name: Record a batch
  description: Take one batch's dose from every stock tank now. For rooms without a mapped tank last-fill entity; with one, batches are counted from it and recording one here as well counts it twice. Needs a Home Assistant administrator when a signed-in user calls it, directly or through a script they start; automations are unaffected.
  fields:
    room_id:
      required: true
      selector:
        text:
    expected_revision:
      required: true
      selector:
        number:
          min: 0
          mode: box
